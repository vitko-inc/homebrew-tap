name: Update formula

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (default: latest)"
        required: false

permissions:
  contents: read

concurrency:
  group: update-formula

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Write the formula
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: .github/scripts/update-formula.sh "$TAG"
      - name: Scan
        run: python3 .github/disclosure/scan.py --no-files --text Formula/vitko.rb < Formula/vitko.rb
      - id: commit
        name: Commit
        run: |
          if git diff --quiet -- Formula && ! git ls-files --others --exclude-standard Formula | grep -q .; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "Formula is current."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula
          git commit -m "vitko $(sed -n 's/^  version "\(.*\)"/\1/p' Formula/vitko.rb)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  test:
    needs: update
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install from the tap
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv 2>/dev/null || true)"
          brew update --quiet >/dev/null || true
          brew install vitko-inc/tap/vitko
          vitko version --output json
          brew test vitko-inc/tap/vitko
